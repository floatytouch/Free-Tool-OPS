<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Caveat:wght@500;700&family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#2A2218;--paper:#F3E6D0;--paper-edge:#E0D0B4;--ink:#1C1510;--ink-soft:#4A3F35;
  --mute:#7A6B5C;--lamp:#FFB84D;--lamp-glow:rgba(255,184,77,.45);--lamp-deep:#C47A2A;
  --tape:#E8D9A8;--tape-shadow:rgba(0,0,0,.25);--sticky:#F7E66B;--sticky-line:#E8C84A;
  --tomato-green:#5A8F4A;--tomato-mid:#B85C38;--tomato-red:#C73B2A;--vine:#3D5C32;
  --accent:var(--lamp-deep);--card-shadow:0 12px 40px rgba(0,0,0,.55)
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;color:var(--ink);font-family:'Be Vietnam Pro',sans-serif}
.hand{font-family:'Caveat',cursive}
.note{font-family:'Mali',cursive}
.mono{font-variant-numeric:tabular-nums}
.abs{position:absolute}
.full{inset:0}
.desk-surface{background:
  radial-gradient(ellipse 900px 700px at 78% 12%,var(--lamp-glow),transparent 55%),
  radial-gradient(ellipse 1400px 900px at 50% 100%,#1a120c,transparent 70%),
  linear-gradient(165deg,#3d3228 0%,var(--desk) 40%,#1f1812 100%)}
.paper-grain{inset:0;opacity:.12;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}
.vignette{inset:0;pointer-events:none;background:radial-gradient(ellipse at 72% 8%,transparent 0%,rgba(0,0,0,.35) 75%)}
.photo-card{background:var(--paper);border:3px solid var(--paper-edge);box-shadow:var(--card-shadow);position:relative}
.photo-card::before,.photo-card::after{content:'';position:absolute;width:72px;height:22px;background:linear-gradient(180deg,var(--tape),#d4c48a);opacity:.85;box-shadow:0 2px 4px var(--tape-shadow);border-radius:2px}
.tape-tl::before{top:-10px;left:24px;transform:rotate(-8deg)}
.tape-tr::after{top:-10px;right:24px;transform:rotate(6deg)}
.tape-bl::before{bottom:-10px;left:40px;transform:rotate(5deg)}
.tape-br::after{bottom:-10px;right:36px;transform:rotate(-4deg)}
.inner-cutout{position:absolute;inset:14px;background:transparent;border:1px dashed rgba(74,63,53,.25);border-radius:2px;pointer-events:none}
.sticky-note{background:var(--sticky);color:var(--ink);padding:10px 18px 12px;box-shadow:2px 4px 12px rgba(0,0,0,.35);transform:rotate(-1.5deg);border-bottom:3px solid var(--sticky-line);max-width:520px;line-height:1.25}
.sticky-note .lines{background:repeating-linear-gradient(transparent,transparent 26px,rgba(28,21,16,.08) 27px)}
.bar-plank{left:32px;right:32px;bottom:18px;height:64px;display:flex;align-items:center;gap:22px;padding:0 22px;background:linear-gradient(180deg,#4a3d32,#3a2f26);border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);color:var(--paper)}
.bar-plank.slim{height:52px;bottom:16px;gap:16px;padding:0 18px}
.bar-plank .sep{width:1px;height:28px;background:rgba(243,230,208,.2)}
.bar-label{font:700 14px 'Be Vietnam Pro';letter-spacing:.14em;text-transform:uppercase;color:var(--lamp)}
.lamp-dot{width:9px;height:9px;border-radius:50%;background:var(--lamp);box-shadow:0 0 14px var(--lamp);animation:lampPulse 2.4s ease-in-out infinite}
@keyframes lampPulse{50%{opacity:.5;box-shadow:0 0 8px var(--lamp)}}
.vinyl-wrap{display:none;align-items:center;gap:10px;max-width:380px}
.vinyl-wrap.show{display:inline-flex}
.vinyl{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#1a1410 8px,#2a2218 9px,#2a2218 100%);border:2px solid #4a3f35;animation:spin 8s linear infinite;flex-shrink:0;position:relative}
.vinyl::after{content:'';position:absolute;inset:6px;border-radius:50%;border:1px solid rgba(243,230,208,.15)}
@keyframes spin{to{transform:rotate(360deg)}}
.vinyl-label{font-size:15px;color:var(--paper);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pomo-pill{display:inline-flex;align-items:center;gap:8px;font:600 15px 'Be Vietnam Pro';color:var(--lamp);padding:4px 12px;border:1px solid rgba(255,184,77,.35);border-radius:999px}
.pomo-pill svg{flex-shrink:0}
.frame-label{display:inline-block;padding:6px 14px;background:var(--paper);color:var(--ink);border:1px solid var(--paper-edge);box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:18px;transform:rotate(-1deg)}
.side-panel{background:linear-gradient(180deg,var(--paper),#e8d9c0);border:2px solid var(--paper-edge);box-shadow:var(--card-shadow);color:var(--ink)}
.k{font:600 12px 'Be Vietnam Pro';color:var(--mute);letter-spacing:.12em;text-transform:uppercase}
.hero-desk{inset:0;overflow:hidden}
.lamp-svg{position:absolute;right:120px;top:40px;filter:drop-shadow(0 0 80px var(--lamp-glow))}
.desk-top{position:absolute;left:0;right:0;bottom:0;height:420px;background:linear-gradient(180deg,#5c4a3a,#3d3228);border-top:4px solid #6b5745}
.book-stack{position:absolute;left:180px;bottom:280px}
.tag-pill{display:inline-block;padding:6px 14px;background:rgba(28,21,16,.75);color:var(--lamp);border:1px solid var(--lamp-deep);border-radius:999px;font:700 13px 'Be Vietnam Pro';letter-spacing:.1em;text-transform:uppercase}
.big-title{font-weight:800;font-size:108px;line-height:1.02;color:var(--paper);letter-spacing:-.02em}
.big-title em{font-style:normal;color:var(--lamp);font-family:'Caveat',cursive;font-size:1.15em}
.tracks{display:flex;gap:20px;margin-top:40px}
.tracks .card{flex:1;padding:22px 24px;background:var(--paper);border:2px solid var(--paper-edge);box-shadow:var(--card-shadow);color:var(--ink);border-radius:4px}
.tracks b{display:block;font-size:24px;margin:8px 0 6px}
.tracks span{color:var(--mute);font-size:17px}
.tomato-lg{width:200px;height:200px;margin:12px auto;display:block}
.prog-rail{height:10px;background:rgba(28,21,16,.12);border-radius:6px;overflow:hidden;margin-top:14px}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--tomato-green),var(--tomato-red));width:0;transition:width .8s linear}
</style></head><body>
<div id="root"></div>
<script>
const q=new URLSearchParams(location.search);
const S=q.get('s')||'start', NAME=q.get('name')||'THINH · BUILD & STUDY', TOPIC=q.get('topic')||'';
const accentMap={start:'var(--lamp-deep)',coding:'var(--lamp-deep)',bot:'var(--lamp-deep)',study:'var(--tomato-red)',brb:'var(--lamp-deep)',end:'var(--lamp-deep)',dual:'var(--lamp-deep)'};
document.documentElement.style.setProperty('--accent',accentMap[S]||'var(--lamp-deep)');
const pad=n=>String(n).padStart(2,'0');
const clock=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
function pomo(){const d=new Date(),m=d.getMinutes(),s=d.getSeconds(),focus=m<50;
 const left=(focus?50*60:60*60)-(m*60+s);const pct=focus?(m*60+s)/3000:(m*60+s-3000)/600;
 return{focus,mm:pad(Math.floor(left/60)),ss:pad(left%60),pct,ripe:focus?Math.min(1,(m*60+s)/3000):0}}
function tomatoSvg(size,ripe,showFace){
 const g=ripe<.35?'#5A8F4A':ripe<.7?'#9A5A38':'#C73B2A';
 const hl=ripe<.35?'#7CB86A':ripe<.7?'#C87848':'#E85A48';
 const face=showFace?`<ellipse cx="50" cy="58" rx="22" ry="18" fill="${hl}" opacity=".35"/>
 <path d="M38 54 Q50 62 62 54" stroke="#1C1510" stroke-width="2" fill="none" opacity=".5"/>
 <circle cx="42" cy="52" r="2.5" fill="#1C1510"/><circle cx="58" cy="52" r="2.5" fill="#1C1510"/>`:'';
 return`<svg class="tomato-svg" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">
 <path d="M50 8 C45 2 38 4 42 12 C35 10 32 18 38 22 C30 24 28 34 36 38 C32 44 38 50 46 48 C44 56 52 62 58 56 C64 62 72 56 68 48 C76 50 82 42 78 36 C86 32 84 22 76 22 C80 14 72 8 66 14 C62 6 54 4 50 8Z" fill="${g}" stroke="#2A2218" stroke-width="1.5"/>
 <path d="M48 6 C50 0 54 0 56 6 C58 2 62 4 60 10 C64 12 62 18 58 16" fill="none" stroke="#3D5C32" stroke-width="2.5" stroke-linecap="round"/>
 ${face}</svg>`}
function lampHero(){return`<svg class="lamp-svg" width="280" height="420" viewBox="0 0 280 420" aria-hidden="true">
 <defs><radialGradient id="glow" cx="50%" cy="30%"><stop offset="0%" stop-color="#FFE4A8"/><stop offset="100%" stop-color="#FFB84D" stop-opacity="0"/></radialGradient></defs>
 <ellipse cx="200" cy="80" rx="200" ry="160" fill="url(#glow)" opacity=".7"/>
 <path d="M140 120 L140 280" stroke="#4A3F35" stroke-width="8" stroke-linecap="round"/>
 <path d="M100 280 L180 280 L170 300 L110 300 Z" fill="#3D3228"/>
 <path d="M80 120 Q140 40 200 120 L180 200 Q140 160 100 200 Z" fill="#E8A84A" stroke="#C47A2A" stroke-width="2"/>
 <ellipse cx="140" cy="200" rx="55" ry="12" fill="#FFD080" opacity=".6"/></svg>`}
function deskBooks(){return`<svg class="book-stack" width="200" height="120" viewBox="0 0 200 120"><rect x="10" y="40" width="50" height="70" fill="#8B5A3C" rx="2"/><rect x="55" y="30" width="45" height="80" fill="#6B4A32" rx="2"/><rect x="95" y="50" width="55" height="60" fill="#A67C52" rx="2"/><rect x="20" y="35" width="40" height="8" fill="#F3E6D0" opacity=".3"/></svg>`}
const bar=(label,slim)=>`<div class="abs bar-plank${slim?' slim':''}">
 <span class="bar-label"><span class="lamp-dot"></span> ${label}</span><span class="sep"></span>
 <span style="font-weight:800;font-size:19px;color:var(--paper)">${NAME}</span><span class="sep"></span>
 <div class="sticky-note note" style="flex:1;min-width:0;padding:8px 14px;font-size:18px;transform:rotate(-1deg)">
  <span id="topic" class="lines" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${TOPIC||'Tonight\'s focus...'}</span></div>
 <div class="vinyl-wrap" id="npWrap"><div class="vinyl" aria-hidden="true"></div><span class="vinyl-label" id="np"></span></div>
 <span class="pomo-pill"><span id="pomoTom"></span><span id="pomoMini"></span></span><span class="mono" id="clk" style="font-size:19px;color:rgba(243,230,208,.75)"></span></div>`;
function photoFrame(l,t,w,h,extraClass){return`<div class="abs photo-card ${extraClass||'tape-tl tape-br'}" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px"><div class="inner-cutout"></div></div>`}
const camSide=photoFrame(1504,32,384,288,'tape-tl tape-tr');
const V={
start:()=>`<div class="abs full desk-surface hero-desk"></div><div class="abs paper-grain"></div><div class="abs vignette"></div>
 ${lampHero()}${deskBooks()}
 <div class="abs desk-top"></div>
 <div class="abs" style="left:140px;top:120px;right:480px;z-index:2">
  <span class="tag-pill">Starting soon</span>
  <div class="big-title hand" style="margin:24px 0 16px">Night desk<br>lights on.<br><em>Study together.</em></div>
  <div style="font-size:24px;color:rgba(243,230,208,.75);margin-bottom:48px">${NAME}${TOPIC?' — '+TOPIC:''}</div>
  <div class="tracks"><div class="card"><span class="k" style="color:var(--lamp-deep)">01 · Code</span><b>Real builds</b><span>Ship features at the desk.</span></div>
  <div class="card"><span class="k" style="color:var(--lamp-deep)">02 · Bot</span><b>AI on the job</b><span>Agents run while you watch.</span></div>
  <div class="card"><span class="k" style="color:var(--tomato-red)">03 · Study</span><b>Study With Me</b><span>Pomodoro 50/10 — focus block.</span></div></div></div>
 <div class="abs" style="right:140px;top:200px;text-align:right;z-index:2"><div class="k" style="color:var(--lamp)">Starting in</div>
 <div class="mono big-title hand" id="cd" style="font-size:96px;color:var(--lamp)">05:00</div></div>`,
coding:()=>`${photoFrame(32,32,1440,935,'tape-tl tape-br')}
 <div class="abs frame-label note" style="left:56px;top:52px">~/live — coding</div>${camSide}
 <div class="abs side-panel side" style="left:1504px;top:340px;width:384px;height:627px;padding:24px">
  <div class="k">On the sticky note</div>
  <div class="sticky-note note" style="margin:12px 0 24px;font-size:22px;transform:rotate(-2deg)">${TOPIC||'Live coding'}</div>
  <div class="k">Desk rules</div><ul style="margin:10px 0 0 18px;color:var(--ink-soft);font-size:17px;line-height:1.75"><li>Ask in chat</li><li>Feedback welcome</li><li>No link spam</li></ul></div>${bar('Live · Code')}`,
bot:()=>`${photoFrame(32,32,1440,935,'tape-tl tape-br')}
 <div class="abs tag-pill" style="left:52px;top:48px">Bot running</div>${camSide}
 <div class="abs side-panel side" style="left:1504px;top:340px;width:384px;height:627px;padding:24px">
  <div class="k">Mission</div>
  <div class="sticky-note note" style="margin:12px 0 24px;font-size:20px">${TOPIC||'Agents pick up work and report back'}</div>
  <div class="k">You will see</div><ul style="margin:10px 0 0 18px;color:var(--ink-soft);font-size:17px;line-height:1.75"><li>Job dispatch</li><li>Background runs</li><li>Real output</li></ul></div>${bar('Live · Bot')}`,
study:()=>`${photoFrame(32,32,1200,935,'tape-tl tape-br')}
 <div class="abs tag-pill" style="left:52px;top:48px;color:var(--tomato-red);border-color:var(--tomato-red)">Study with me</div>
 <div class="abs side-panel" style="left:1264px;top:32px;width:624px;height:935px;padding:36px 40px">
  <div class="k" id="phase"></div>
 <div id="tomatoBig">${tomatoSvg(200,.5,true)}</div>
  <div class="mono" id="pomoBig" style="font-size:88px;font-weight:800;text-align:center;line-height:1;margin:4px 0 8px;color:var(--ink)"></div>
  <div class="prog-rail"><div id="prog" class="prog-fill"></div></div>
  <div style="display:flex;justify-content:space-between;margin-top:10px;color:var(--mute);font-size:16px"><span>Focus 50m</span><span>Break 10m</span></div>
  <div class="k" style="margin-top:40px">Studying now</div>
  <div class="sticky-note note" style="margin-top:10px;font-size:24px">${TOPIC||'Reading docs and notes'}</div>
  <div class="k" style="margin-top:36px">Together</div>
  <div style="color:var(--ink-soft);font-size:18px;line-height:1.65;margin-top:8px">Type <b style="color:var(--tomato-red)">!task</b> + your focus.<br>Chat on breaks — quiet focus time.</div></div>${bar('Live · Study')}`,
brb:()=>`<div class="abs full desk-surface hero-desk"></div><div class="abs paper-grain"></div><div class="abs vignette"></div>${lampHero()}
 <div class="abs desk-top"></div><div class="abs" style="left:0;right:0;top:340px;text-align:center;z-index:2">
 <span class="tag-pill">Be right back</span><div class="big-title hand" style="margin-top:18px;font-size:100px">Stretch · water</div>
 <div style="font-size:24px;color:rgba(243,230,208,.7);margin-top:12px">The lamp stays on — back in a moment.</div></div>`,
end:()=>`<div class="abs full desk-surface hero-desk"></div><div class="abs paper-grain"></div><div class="abs vignette"></div>${lampHero()}${deskBooks()}
 <div class="abs desk-top"></div><div class="abs" style="left:140px;top:200px;right:140px;z-index:2">
 <span class="tag-pill">Offline</span><div class="big-title" style="font-size:88px;line-height:1.05;margin:20px 0 16px">Desk cleared — see you next stream</div>
 <div style="font-size:26px;color:rgba(243,230,208,.75);margin-bottom:36px">Thanks for studying along. Follow for the next night session.</div>
 <div class="sticky-note note" style="display:inline-block;font-size:26px;padding:14px 28px">Follow · ${NAME}</div></div>`,
dual:()=>`${photoFrame(32,32,920,935,'tape-tl')}${photoFrame(968,32,920,935,'tape-tr')}
 <div class="abs frame-label note" style="left:52px;top:48px">Display 1</div>
 <div class="abs frame-label note" style="left:988px;top:48px">Display 2</div>
 ${photoFrame(1536,771,336,180,'tape-bl')}
 <div class="abs tag-pill" style="left:1548px;top:742px;font-size:11px">Cam</div>${bar(q.get('label')||'Live · Dual screen',true)}`};
document.getElementById('root').innerHTML=V[S]();
const until=q.get('at'); let end=Date.now()+5*60e3;
if(until){const[h,m]=until.split(':').map(Number);const t=new Date();t.setHours(h,m,0,0);end=t.getTime()}
function updateTomato(ripe){
 const el=document.getElementById('tomatoBig');if(el)el.innerHTML=tomatoSvg(200,ripe,true)}
function tick(){const c=document.getElementById('clk');if(c)c.textContent=clock();
 const p=pomo(),pm=document.getElementById('pomoMini'),pt=document.getElementById('pomoTom');
 if(pt)pt.innerHTML=tomatoSvg(22,p.focus?p.ripe:.15,false);
 if(pm)pm.textContent=(p.focus?'FOCUS ':'BREAK ')+p.mm+':'+p.ss;
 const pb=document.getElementById('pomoBig');if(pb){pb.textContent=p.mm+':'+p.ss;pb.style.color=p.focus?'var(--ink)':'var(--lamp-deep)';
  const ph=document.getElementById('phase');if(ph)ph.textContent=p.focus?'● Focus block':'○ Break time';
  const pr=document.getElementById('prog');if(pr)pr.style.width=(p.pct*100)+'%';updateTomato(p.focus?p.ripe:.2)}
 const cd=document.getElementById('cd');if(cd){const l=Math.max(0,Math.round((end-Date.now())/1e3));cd.textContent=l?pad(Math.floor(l/60))+':'+pad(l%60):'LIVE'}}
tick();setInterval(tick,1000);
async function nowPlaying(){const wrap=document.getElementById('npWrap'),el=document.getElementById('np');if(!wrap||!el)return;
 try{const r=await fetch('../nowplaying.json?t='+Date.now());const{track}=await r.json();
  wrap.classList.toggle('show',!!track);el.textContent=track||''}catch(e){wrap.classList.remove('show')}}
nowPlaying();setInterval(nowPlaying,5000);
</script></body></html>
